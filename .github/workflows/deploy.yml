name: Deploy to InfinityFree

on:
  push:
    branches:
      - main  # Triggers the deploy when you push to the main branch

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    # Optional: If your project needs a build step (like React, Vue, or Vite), 
    # uncomment the lines below to install dependencies and build your project.
    # - name: 🔨 Install and Build
    #   run: |
    #     npm install
    #     npm run build

    - name: 🚀 FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWD }}
        # local-dir: ./     # Change this to ./dist/ or ./build/ if using a framework
        server-dir: htdocs/ # Uploads directly into InfinityFree's public folder